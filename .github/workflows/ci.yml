name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"
  # Must match EXPOSE in the Dockerfile and the port the process listens on.
  APP_PORT: "8080"
  HEALTH_PATH: "/health"

jobs:
  test:
    name: Fmt, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig version
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src examples
      - name: Unit tests and README samples
        run: zig build test --summary all
      - name: Release build
        run: zig build -Doptimize=safe
      - name: Cross-compile smoke check
        run: |
          zig build -Doptimize=small -Dtarget=aarch64-linux-musl
          zig build -Doptimize=small -Dtarget=x86_64-windows-gnu

  docker:
    name: Docker image builds and answers on APP_PORT
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: guide-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:${APP_PORT} guide-app:ci
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:8080${HEALTH_PATH}" > /dev/null; then
              echo "Container answered on port ${APP_PORT}"
              curl -fsS -X POST --data-binary "zig zig ziggy" "http://localhost:8080/stats?top=1"
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
